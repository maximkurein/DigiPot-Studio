[workspace]
resolver = "2"
members = ["crates/digipot-core", "crates/digipot-server", "crates/digipot-egui", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Kurein M N"]
repository = "https://github.com/maximkurein/DigiPot-Studio"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
