name: Ошибка
description: Что-то не работает или ведёт себя неожиданно
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Спасибо за отчёт! Сначала проверьте последнюю версию DigiPot Studio.
  - type: input
    id: version
    attributes:
      label: Версия DigiPot Studio
      description: Показана внизу боковой панели приложения
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11
        - Linux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - Desktop (Tauri)
        - Нативный интерфейс (egui)
        - Веб / удалённая лаборатория (digipot-server)
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Подключение
      options:
        - Симулятор
        - USB-мост (последовательный порт)
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть «Регистры»
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Конфигурация регистров
      description: «Регистры → Экспорт» — вставьте сюда
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Журнал шины
      description: Фрагмент журнала (⌘/Ctrl + J) вокруг ошибки
      render: text
