<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Архитектура DigiPot Studio: интерфейс React в Tauri или браузере либо нативный egui, ядро на Rust, симулятор или USB-мост к плате">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#818cf8"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <clipPath id="card"><rect width="1200" height="560" rx="24"/></clipPath>
  </defs>
  <style>
    .t{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    .col{font-size:11px;letter-spacing:1.4px;fill:#7d8aa0}
    .h{font-size:15px;font-weight:700;fill:#e8edf5}
    .s{font-size:12px;fill:#b6c1d3}
    .chip{font-size:11.5px;fill:#c7d2fe}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <rect width="1200" height="560" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="23.5" fill="none" stroke="#222b3b"/>

  <text class="t" x="51" y="52" font-size="24" font-weight="700" fill="#e8edf5">Архитектура программы</text>
  <text class="t" x="51" y="78" font-size="14" fill="#b6c1d3">Вся физика и логика — в Rust. Один RPC обслуживает Tauri-приложение, нативный интерфейс egui и веб-режим.</text>

  <g class="t">
    <text x="51" y="118" class="col">ИНТЕРФЕЙС</text>
    <text x="361" y="118" class="col">ЗАПУСК · ТРАНСПОРТ</text>
    <text x="631" y="118" class="col">ЯДРО · RUST</text>
    <text x="961" y="118" class="col">УСТРОЙСТВО</text>
  </g>

  <!-- UI column -->
  <rect x="51" y="132" width="260" height="344" rx="14" fill="#818cf8" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.4"/>
  <g class="t">
    <text x="71" y="158" class="h">Два интерфейса</text>
    <text x="71" y="176" class="s">одни экраны и тексты + журнал шины</text>
  </g>
  <g class="t" text-anchor="middle">
    <rect x="71" y="188" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="124" y="204" class="chip">Потенциометр</text>
    <rect x="185" y="188" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="238" y="204" class="chip">Обзор</text>
    <rect x="71" y="218" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="124" y="234" class="chip">EEPROM</text>
    <rect x="185" y="218" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="238" y="234" class="chip">Регистры</text>
    <rect x="71" y="248" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="124" y="264" class="chip">Плата</text>
    <rect x="185" y="248" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="238" y="264" class="chip">Подключение</text>
    <rect x="71" y="278" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="124" y="294" class="chip">Академия</text>
    <rect x="185" y="278" width="106" height="24" rx="7" fill="#818cf8" fill-opacity="0.12"/><text x="238" y="294" class="chip">О программе</text>
  </g>
  <rect x="71" y="316" width="220" height="62" rx="10" fill="#0b0f18" stroke="#2d384b"/>
  <text class="t" x="85" y="337" font-size="12.5" font-weight="600" fill="#e8edf5">React 19 · Tailwind 4</text>
  <text class="m" x="85" y="355" font-size="11.5" fill="#c7d2fe">rpc(cmd, args)</text>
  <text class="t" x="85" y="370" font-size="11" fill="#7d8aa0">src/ · WebView или браузер</text>
  <rect x="71" y="388" width="220" height="70" rx="10" fill="#0b0f18" stroke="#2d384b"/>
  <text class="t" x="85" y="409" font-size="12.5" font-weight="600" fill="#e8edf5">egui · eframe (нативный)</text>
  <text class="m" x="85" y="427" font-size="11.5" fill="#c7d2fe">Job → поток движка</text>
  <text class="t" x="85" y="447" font-size="11" fill="#7d8aa0">crates/digipot-egui · без Node</text>

  <!-- transport -->
  <rect x="361" y="140" width="220" height="104" rx="14" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.4"/>
  <g class="t">
    <text x="381" y="167" class="h">Desktop · Tauri 2</text>
    <text class="m" x="381" y="190" font-size="12.5" fill="#67e8f9">invoke("rpc")</text>
    <text x="381" y="211" class="s">macOS .app / .dmg</text>
    <text x="381" y="230" class="s">Windows .exe / .msi</text>
  </g>
  <rect x="361" y="258" width="220" height="104" rx="14" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.4"/>
  <g class="t">
    <text x="381" y="285" class="h">Web · digipot-server</text>
    <text class="m" x="381" y="308" font-size="12.5" fill="#67e8f9">POST /api/rpc</text>
    <text x="381" y="329" class="s">axum · 127.0.0.1:7878</text>
    <text x="381" y="348" class="s">«удалённая лаборатория»</text>
  </g>
  <rect x="361" y="376" width="220" height="100" rx="14" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.4"/>
  <g class="t">
    <text x="381" y="403" class="h">Native · digipot-egui</text>
    <text class="m" x="381" y="426" font-size="12.5" fill="#67e8f9">Engine::handle напрямую</text>
    <text x="381" y="447" class="s">движок в своём потоке</text>
    <text x="381" y="466" class="s">macOS .app / .dmg</text>
  </g>

  <!-- core -->
  <rect x="631" y="132" width="280" height="344" rx="14" fill="#fb923c" fill-opacity="0.05" stroke="#fb923c" stroke-opacity="0.75" stroke-width="1.4"/>
  <rect x="649" y="148" width="244" height="64" rx="11" fill="#0b0f18" stroke="#fb923c" stroke-opacity="0.6"/>
  <text class="m" x="667" y="174" font-size="13.5" font-weight="700" fill="#fdba74">Engine::handle(cmd, args)</text>
  <text class="t" x="667" y="196" font-size="11.5" fill="#b6c1d3">автозапись · журнал шины</text>
  <g class="t">
    <rect x="649" y="228" width="118" height="70" rx="10" fill="#141a26" stroke="#2d384b"/>
    <text class="m" x="663" y="252" font-size="12.5" font-weight="700" fill="#e8edf5">regs.rs</text>
    <text x="663" y="271" font-size="11.5" fill="#7d8aa0">карта регистров,</text>
    <text x="663" y="286" font-size="11.5" fill="#7d8aa0">биты по даташиту</text>
    <rect x="775" y="228" width="118" height="70" rx="10" fill="#141a26" stroke="#2d384b"/>
    <text class="m" x="789" y="252" font-size="12.5" font-weight="700" fill="#e8edf5">bus.rs</text>
    <text x="789" y="271" font-size="11.5" fill="#7d8aa0">кадры шины</text>
    <text x="789" y="286" font-size="11.5" fill="#7d8aa0">SPI · 3 провода</text>
    <rect x="649" y="306" width="118" height="70" rx="10" fill="#141a26" stroke="#2d384b"/>
    <text class="m" x="663" y="330" font-size="12.5" font-weight="700" fill="#e8edf5">model.rs</text>
    <text x="663" y="349" font-size="11.5" fill="#7d8aa0">расчёт,</text>
    <text x="663" y="364" font-size="11.5" fill="#7d8aa0">проверки даташита</text>
    <rect x="775" y="306" width="118" height="70" rx="10" fill="#141a26" stroke="#2d384b"/>
    <text class="m" x="789" y="330" font-size="12.5" font-weight="700" fill="#e8edf5">api.rs</text>
    <text x="789" y="349" font-size="11.5" fill="#7d8aa0">RPC-движок,</text>
    <text x="789" y="364" font-size="11.5" fill="#7d8aa0">журнал, снимок</text>
    <rect x="649" y="384" width="118" height="70" rx="10" fill="#141a26" stroke="#2d384b"/>
    <text class="m" x="663" y="408" font-size="12.5" font-weight="700" fill="#e8edf5">sim.rs</text>
    <text x="663" y="427" font-size="11.5" fill="#7d8aa0">виртуальный</text>
    <text x="663" y="442" font-size="11.5" fill="#7d8aa0">кристалл</text>
    <rect x="775" y="384" width="118" height="70" rx="10" fill="#141a26" stroke="#34d399" stroke-opacity="0.7"/>
    <text class="m" x="789" y="408" font-size="12.5" font-weight="700" fill="#e8edf5">transport.rs</text>
    <text x="789" y="427" font-size="11.5" fill="#7d8aa0">Link: симулятор</text>
    <text x="789" y="442" font-size="11.5" fill="#7d8aa0">или USB-мост</text>
  </g>

  <!-- device column -->
  <g class="t">
    <rect x="961" y="152" width="188" height="64" rx="12" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="979" y="178" class="h">VirtualChip</text>
    <text x="979" y="199" class="s">без платы, по даташиту</text>

    <rect x="961" y="252" width="188" height="56" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="979" y="276" class="h">SerialBridge</text>
    <text x="979" y="296" class="s">USB-serial · 115200</text>

    <rect x="961" y="334" width="188" height="56" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="979" y="358" class="h">МК 3.3 В</text>
    <text class="m" x="979" y="378" font-size="11.5" fill="#6ee7b7">firmware/bridge</text>

    <rect x="961" y="416" width="188" height="60" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.4"/>
    <text x="979" y="442" class="h">DIGI POT click (MIKROE-923)</text>
    <text x="979" y="462" class="s">MCP4161 · SPI · mikroBUS</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke-width="2">
    <path class="flow" d="M291 347H330V192H359" stroke="#818cf8" marker-end="url(#aI)"/>
    <path class="flow" d="M330 310H359" stroke="#818cf8" marker-end="url(#aI)"/>
    <path class="flow" d="M291 423H359" stroke="#818cf8" marker-end="url(#aI)"/>
    <path class="flow" d="M581 192H606V180H647" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path class="flow" d="M581 310H606V180" stroke="#22d3ee"/>
    <path class="flow" d="M581 426H606V310" stroke="#22d3ee"/>
    <path class="flow" d="M893 419H930V184H959" stroke="#fb923c" marker-end="url(#aA)"/>
    <path class="flow" d="M930 280H959" stroke="#34d399" marker-end="url(#aG)"/>
    <path class="flow" d="M1055 308V332" stroke="#34d399" marker-end="url(#aG)"/>
    <path class="flow" d="M1055 390V414" stroke="#34d399" marker-end="url(#aG)"/>
  </g>
  <g class="t" font-size="11" fill="#7d8aa0">
    <text x="1062" y="325">USB</text>
    <text x="1062" y="407">SPI</text>
  </g>

  <text class="t" x="51" y="520" font-size="13" fill="#b6c1d3">Новая функция = команда в <tspan class="m" fill="#fdba74">api.rs</tspan> + типы в <tspan class="m" fill="#c7d2fe">types.ts</tspan> + экран в <tspan class="m" fill="#c7d2fe">digipot-egui</tspan>. Интерфейсы только форматируют и рисуют.</text>
</svg>
